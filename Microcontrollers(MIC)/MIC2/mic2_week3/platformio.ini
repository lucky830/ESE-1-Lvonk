; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:xplained_mini]
platform = atmelavr
framework = arduino

; Tools > Board > MiniCore > ATmega328
; Tools > Variant > 328P / 328PA
board = ATmega328P

; Xplained Mini uses 16 MHz external clock
board_build.f_cpu = 16000000L
board_hardware.oscillator = external

; Tools > Bootloader > No bootloader
board_bootloader.type = no_bootloader
board_hardware.uart = no_bootloader

; Typical MiniCore options
board_hardware.bod = 2.7v
board_hardware.eesave = yes

; Tools > Programmer > Xplained Mini
upload_protocol = custom

upload_flags =
    -C$PROJECT_PACKAGES_DIR/tool-avrdude/avrdude.conf
    -p$BOARD_MCU
    -cxplainedmini
    -Pusb

upload_command = avrdude $UPLOAD_FLAGS -U flash:w:$SOURCE:i

